name: Release ShareFolder App

on:
  push:
    tags:
      - 'sharefolder-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. sharefolder-v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-14
            platform: darwin
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Make ShareFolder app
        working-directory: packages/sharefolder-app
        env:
          NODE_ENV: production
        run: npm run make

      - name: Collect release assets
        shell: bash
        run: |
          chmod +x scripts/collect-sharefolder-artifacts.sh
          scripts/collect-sharefolder-artifacts.sh "${{ github.workspace }}/release-assets" "${{ matrix.platform }}"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sharefolder-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ShareFolder ${{ steps.tag.outputs.name }}
          draft: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
